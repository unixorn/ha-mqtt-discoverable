[project]
name = "ha-mqtt-discoverable"
version = "0.26.0"
description = "Python library for creating MQTT entities compatible with Home Assistant"
authors = [{ name = "Joe Block", email = "jpb@unixorn.net" }]
readme = "README.md"
license = 'Apache-2.0'
license-files = ['LICENSE']
requires-python = ">=3.11.0"
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "paho-mqtt>=2.1.0",
    "pydantic>=2.14.0",
]

[project.urls]
GitHub = "https://github.com/unixorn/ha-mqtt-discoverable"
Issues = "https://github.com/unixorn/ha-mqtt-discoverable/issues"
Documentation = "https://github.com/unixorn/ha-mqtt-discoverable#readme"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
]
test = [
    "coverage>=7.16.2",
    "pytest>=9.1.1",
    "pytest-mock>=3.16.0",
]

[build-system]
requires = ["poetry-core>=2.5.0"]
build-backend = "poetry.core.masonry.api"
