---
# This workflow will build a Python wheel, a Docker image containing the CLI tool and publish both to PyPi and DockerHub

name: Build and publish

# Run only when pushing a Git version tag
on: # yamllint disable-line rule:truthy
  push:
    tags:
      - "v*"

permissions:
  # Allow the workflow to check out the tagged source before building artifacts.
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-wheel:
    name: Build and publish Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install poetry
        run: pipx install poetry

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Bump version and build package
        run: |
          # Extract the package version from the latest git tag, removing the leading `v`
          VERSION=$(git describe --tags --abbrev=0 | sed --quiet --regexp-extended 's/v(.*)/\1/p')
          echo "$VERSION"
          # Set package version using poetry CLI
          poetry version "$VERSION"
          poetry build

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Python package
          path: dist/
          if-no-files-found: error

      - name: Publish wheel
        run: |
          poetry publish --username __token__ --password "$PYPI_PASSWORD"
        env:
          PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}

  docker-image:
    needs: build-wheel
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Python package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Python package
          path: dist/

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            application_version=${{ github.ref_name }}
          push: true
          platforms: linux/arm64,linux/amd64,linux/arm/v7
          tags: unixorn/ha-mqtt-discoverable:${{ github.ref_name }}
